name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Required for RubyGems trusted publishing (OIDC). No API token needed.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: verify tag matches version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(ruby -e "require './lib/kirimi/version'; print Kirimi::VERSION")"
          if [ "$tag" != "$ver" ]; then
            echo "tag=$tag lib/kirimi/version.rb=$ver" >&2
            exit 1
          fi

      - run: bundle exec rake

      # Exchanges the GitHub OIDC token for a short-lived RubyGems credential.
      # Requires a trusted publisher configured for this gem on rubygems.org.
      # Pinned: this repo publishes v2.1.0 but no floating v2 tag.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - run: gem build kirimi.gemspec
      - run: gem push kirimi-*.gem

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
